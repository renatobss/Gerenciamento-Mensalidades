<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gerenciamento de Mensalidades</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

    <div class="panel form-panel login-box">
        <!-- <p class="eyebrow">Área Restrita</p> -->
        <h2>Acesso ao Sitema</h2>
    
        <form id="login-Form">
            <div>
                <label for="usuario">Usuário:</label>
                <input type="text" id="usuarioInput" name="usuario" required data-test ="user" placeholder="Digite seu usuário">
            </div>

            <div>
                <label for="senha">Senha:</label>
                <input type="password" id="senhaInput" name="senha" required data-test="senha" placeholder="Digite sua senha">
            </div>    
                
            <div id="mensagemErroLogin" data-test="error-message" style="display: none;"></div>
                
            <button type="submit" data-test="login-button" style="width: 100%;">Entrar no Sistema</button>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
