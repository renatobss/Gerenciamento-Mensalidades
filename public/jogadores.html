<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogadores - Gerenciamento de Mensalidades</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside id="menuLateral" class="sidebar" data-test="menu-lateral"></aside>
    <div class="sidebar-fundo"></div>

    <div class="app-principal">
      <div class="topo-mobile">
        <button type="button" aria-label="Abrir menu" aria-expanded="false" data-test="btn-menu">☰</button>
        <span>Mensalidades FC</span>
      </div>

      <main class="pagina">
        <header class="pagina-cabecalho">
          <div>
            <p class="eyebrow">Elenco</p>
            <h1>Jogadores</h1>
            <p class="pagina-descricao">Cadastro dos integrantes do grupo e do valor da mensalidade de cada um.</p>
          </div>
          <button type="button" id="btnNovoJogador" class="btn" data-test="btn-novo-jogador">+ Novo jogador</button>
        </header>

        <section class="panel">
          <div class="barra-filtros">
            <input
              type="search"
              id="pesquisaJogador"
              class="campo-pesquisa"
              placeholder="Pesquisar por nome ou CPF"
              aria-label="Pesquisar jogadores"
              data-test="input-pesquisa-jogador"
            >
            <select id="filtroStatusJogador" aria-label="Filtrar por situação" data-test="filtro-status-jogador">
              <option value="ativo">Ativos</option>
              <option value="inativo">Inativos</option>
              <option value="todos">Todos</option>
            </select>
          </div>

          <div class="table-wrapper">
            <table class="tabela tabela-responsiva" data-test="tabela-jogadores">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Telefone</th>
                  <th>Entrada</th>
                  <th>Mensalidade</th>
                  <th>Pendente</th>
                  <th>Situação</th>
                  <th><span class="sr-only">Ações</span></th>
                </tr>
              </thead>
              <tbody id="corpoTabelaJogadores"></tbody>
            </table>
          </div>
          <p id="semJogadores" class="estado-vazio" data-test="mensagem-sem-jogadores" hidden>Nenhum jogador encontrado.</p>

          <nav class="paginacao" aria-label="Paginação" data-test="paginacao">
            <span id="infoPaginacao" data-test="info-paginacao"></span>
            <div class="paginacao-botoes">
              <button type="button" id="btnPaginaAnterior" class="btn btn-secundario btn-pequeno" data-test="btn-pagina-anterior">Anterior</button>
              <button type="button" id="btnProximaPagina" class="btn btn-secundario btn-pequeno" data-test="btn-proxima-pagina">Próxima</button>
            </div>
          </nav>
        </section>
      </main>
    </div>
  </div>

  <!-- Modal de cadastro/edição de jogador -->
  <dialog id="modalJogador" class="modal" aria-labelledby="tituloModalJogador" data-test="modal-jogador">
    <form id="formJogador" class="modal-conteudo" novalidate>
      <h2 id="tituloModalJogador" class="modal-titulo" data-test="titulo-modal-jogador">Novo jogador</h2>

      <div id="erroFormularioJogador" class="alerta alerta-erro" role="alert" data-test="mensagem-erro-formulario-jogador" hidden></div>

      <div class="form-grade">
        <div class="campo campo-largo">
          <label for="nomeJogador">Nome completo <span class="obrigatorio">*</span></label>
          <input type="text" id="nomeJogador" name="nomeCompleto" maxlength="100" autocomplete="off" required data-test="input-nome-jogador">
          <p id="erro-nomeJogador" class="campo-erro" data-test="erro-nome-jogador" hidden></p>
        </div>

        <div class="campo">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off" data-test="input-cpf">
          <p id="erro-cpf" class="campo-erro" data-test="erro-cpf" hidden></p>
        </div>

        <div class="campo">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" inputmode="numeric" maxlength="15" placeholder="(00) 00000-0000" autocomplete="off" data-test="input-telefone">
          <p id="erro-telefone" class="campo-erro" data-test="erro-telefone" hidden></p>
        </div>

        <div class="campo">
          <label for="dataNascimento">Data de nascimento</label>
          <input type="date" id="dataNascimento" name="dataNascimento" data-test="input-data-nascimento">
          <p id="erro-dataNascimento" class="campo-erro" data-test="erro-data-nascimento" hidden></p>
        </div>

        <div class="campo">
          <label for="dataEntrada">Data de entrada no grupo <span class="obrigatorio">*</span></label>
          <input type="date" id="dataEntrada" name="dataEntrada" required data-test="input-data-entrada">
          <p id="erro-dataEntrada" class="campo-erro" data-test="erro-data-entrada" hidden></p>
        </div>

        <div class="campo">
          <label for="valorMensalidade">Valor da mensalidade (R$) <span class="obrigatorio">*</span></label>
          <input type="text" id="valorMensalidade" name="valorMensalidade" inputmode="decimal" placeholder="0,00" required data-test="input-valor-mensalidade">
          <p id="erro-valorMensalidade" class="campo-erro" data-test="erro-valor-mensalidade" hidden></p>
        </div>

        <div class="campo">
          <label for="statusJogador">Situação</label>
          <select id="statusJogador" name="ativo" data-test="select-status-jogador">
            <option value="ativo">Ativo</option>
            <option value="inativo">Inativo</option>
          </select>
        </div>

        <div class="campo campo-largo">
          <label for="observacoes">Observações</label>
          <textarea id="observacoes" name="observacoes" rows="3" maxlength="500" data-test="input-observacoes"></textarea>
          <p id="erro-observacoes" class="campo-erro" data-test="erro-observacoes" hidden></p>
        </div>
      </div>

      <div class="modal-acoes">
        <button type="button" id="btnCancelarJogador" class="btn btn-secundario" data-test="btn-fechar-modal-jogador">Cancelar</button>
        <button type="submit" id="btnSalvarJogador" class="btn" data-test="btn-salvar-jogador">Salvar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/jogadores.js"></script>
</body>
</html>
